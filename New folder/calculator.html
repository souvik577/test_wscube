<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Calculator</title>
    <link rel="stylesheet" href="cal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <div class="calculator border p-3">
        <input type="text" id="display" class="form-control output mb-3" disabled>
        <div class="d-grid gap-2">
            <div class="d-flex justify-content-between">
                <button class="btn btn-danger btn-custom" onclick="clearDisplay()">C</button>
                <button class="btn btn-secondary btn-custom" onclick="appendToDisplay('/')">/</button>
                <button class="btn btn-secondary btn-custom" onclick="appendToDisplay('*')">*</button>
                <button class="btn btn-secondary btn-custom" onclick="appendToDisplay('-')">-</button>
            </div>
            <div class="d-flex justify-content-between">
                <button class="btn btn-light btn-custom" onclick="appendToDisplay('7')">7</button>
                <button class="btn btn-light btn-custom" onclick="appendToDisplay('8')">8</button>
                <button class="btn btn-light btn-custom" onclick="appendToDisplay('9')">9</button>
                <button class="btn btn-secondary btn-custom" onclick="appendToDisplay('+')">+</button>
            </div>
            <div class="d-flex justify-content-between">
                <button class="btn btn-light btn-custom" onclick="appendToDisplay('4')">4</button>
                <button class="btn btn-light btn-custom" onclick="appendToDisplay('5')">5</button>
                <button class="btn btn-light btn-custom" onclick="appendToDisplay('6')">6</button>
                <button class="btn btn-secondary btn-custom" onclick="appendToDisplay('.')">.</button>
            </div>
            <div class="d-flex justify-content-between">
                <button class="btn btn-light btn-custom" onclick="appendToDisplay('1')">1</button>
                <button class="btn btn-light btn-custom" onclick="appendToDisplay('2')">2</button>
                <button class="btn btn-light btn-custom" onclick="appendToDisplay('3')">3</button>
                <button class="btn btn-primary btn-custom" onclick="calculateResult()">=</button>
            </div>
            <div class="d-flex justify-content-between">
                <button class="btn btn-light btn-custom w-75" onclick="appendToDisplay('0')">0</button>
                <button class="btn btn-warning btn-custom" onclick="deleteLast()">⌫</button>
            </div>
        </div>
    </div>
    
    <script src="cal.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</body>
</html>
